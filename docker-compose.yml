# docker-compose.yml
# Purpose: Production deployment OPTIMIZED for 2 vCPU + 4GB RAM + 20 concurrent users
# Updated: Oct 7, 2025 - Faster updates with efficient resource allocation
# Reduces server load: Single backend, optimized workers, pgbouncer pooling, Redis caching, Nginx proxy
# Test: docker-compose up --build

services:
  # PostgreSQL Database - Optimized for 20 concurrent users
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: crypto_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: postgres -c max_connections=100 -c shared_buffers=256MB -c effective_cache_size=1GB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c work_mem=8MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 896M
        reservations:
          cpus: '0.4'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    platform: linux/amd64
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis for Caching and Celery - Optimized for faster updates
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --tcp-backlog 511
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.3'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Replica 1 (Only one for 4GB RAM)
  backend1: &backend-service
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 640M
        reservations:
          cpus: '0.4'
          memory: 320M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for Background Tasks - Optimized for 20 concurrent users
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: []
    command: celery -A project_config worker --loglevel=info --concurrency=2 --prefetch-multiplier=1 --max-memory-per-child=150000 --max-tasks-per-child=100
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512M
        reservations:
          cpus: '0.4'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

    # Celery Beat Scheduler - Optimized intervals for 20 concurrent users
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: []
    command: celery -A project_config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Binance Data Worker - Fetches real crypto data from Binance API - Optimized for WebSocket
  data-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: appuser
    working_dir: /app
    entrypoint: []
    command: >
      bash -c "
        export PATH=/home/appuser/.local/bin:$$PATH &&
        export PYTHONPATH=/app &&
        echo '⏳ Waiting for database services to be ready...' &&
        /app/wait-for-services.sh pgbouncer 5432 60 &&
        echo '🔄 Running database migrations...' &&
        python manage.py migrate --check || python manage.py migrate &&
        echo '✅ Migrations complete!' &&
        echo '🚀 Starting Binance WebSocket data fetcher...' &&
        python manage.py start_websocket
      "
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 448M
        reservations:
          cpus: '0.3'
          memory: 224M
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Single Calculation Worker for metrics processing - Optimized for 80s interval
  calc-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: []
    command: celery -A project_config worker --loglevel=info --concurrency=2 --hostname=calc-worker@%h --prefetch-multiplier=1 --max-memory-per-child=100000 --max-tasks-per-child=100
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 320M
        reservations:
          cpus: '0.2'
          memory: 160M
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # NOTE: Telegram Bot Integration
  # The bot runs automatically in the celery-beat service (see below)
  # For manual testing: docker-compose exec backend1 python manage.py telegram_polling
  # For production webhook: docker-compose exec backend1 python manage.py set_telegram_webhook https://yourdomain.com/api/telegram/webhook/

  # Nginx Load Balancer (Optimized for single backend)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8081:8081"  # Status page
    volumes:
      - ./nginx/local_nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      backend1:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend - PRODUCTION BUILD (Fast & Optimized) - Optimized for 20 concurrent users
  # Built locally to avoid macOS Docker SIGBUS, then copied into container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 320M
    depends_on:
      - nginx
      - backend1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data: